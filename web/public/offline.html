<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeInvader - Offline</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;600;700&family=Fira+Code:wght@400;500&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Fira Sans', system-ui, sans-serif;
      background: #18181b;
      color: #fafafa;
      padding: 24px;
    }
    .container {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .icon-wrap {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      border-radius: 20px;
      background: linear-gradient(135deg, #0ea5e9, #14b8a6);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0.4); }
      50% { box-shadow: 0 0 0 12px rgba(14, 165, 233, 0); }
    }
    .icon-wrap svg { width: 40px; height: 40px; fill: white; }
    h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(to right, #0ea5e9, #14b8a6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    .subtitle {
      font-family: 'Fira Code', monospace;
      font-size: 10px;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 32px;
    }
    .card {
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 16px;
      padding: 32px 24px;
      margin-bottom: 24px;
    }
    .status-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.1);
      border: 2px solid rgba(239, 68, 68, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .status-icon svg { width: 24px; height: 24px; stroke: #ef4444; fill: none; }
    .card h2 {
      font-size: 18px;
      font-weight: 600;
      color: #fafafa;
      margin-bottom: 8px;
    }
    .card p {
      font-size: 13px;
      color: #a1a1aa;
      line-height: 1.6;
    }
    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }
    .btn {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0ea5e9, #14b8a6);
      color: white;
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(14, 165, 233, 0.4); }
    .btn-secondary {
      background: #3f3f46;
      color: #d4d4d8;
      border: 1px solid #52525b;
    }
    .btn-secondary:hover { background: #52525b; }
    .hint {
      font-family: 'Fira Code', monospace;
      font-size: 9px;
      color: #52525b;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
    </div>
    <h1>LifeInvader</h1>
    <p class="subtitle">Manual Advertisement Generator</p>

    <div class="card">
      <div class="status-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"/>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
          <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
          <line x1="12" y1="20" x2="12.01" y2="20"/>
        </svg>
      </div>
      <h2>You're Offline</h2>
      <p>No internet connection detected. You can use cached data or wait for your connection to restore.</p>
      <div class="buttons">
        <button class="btn btn-secondary" onclick="window.location.href='/'">Use Cache</button>
        <button class="btn btn-primary" onclick="window.location.reload()">Retry</button>
      </div>
    </div>

    <p class="hint">Cached data may be outdated. Reconnect for latest content.</p>
  </div>
</body>
</html>
